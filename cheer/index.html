<style>
:root{
  --bg:#F6F3F5; --surface:#FFFFFF; --ink:#26221E; --muted:#6F675E; --line:#E4DDD3;
  --accent:#4E3346; --gold:#9A5C86; --soft:#F1E6EE; --pale:#E2B8D4;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-latin:"Cormorant Garamond","Shippori Mincho B1",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding:env(safe-area-inset-top,0) max(16px,env(safe-area-inset-right,0)) env(safe-area-inset-bottom,0) max(16px,env(safe-area-inset-left,0))}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:22px 0 64px;display:flex;flex-direction:column;gap:16px}
.brand{text-align:center;display:flex;flex-direction:column;gap:0;cursor:pointer;background:none;border:0;padding:0}
.brand .logo{font-family:var(--f-latin);font-weight:600;font-size:32px;letter-spacing:.24em;margin-left:.24em}
.brand .sub{font-size:12px;letter-spacing:.18em;color:var(--muted)}
nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px}
nav button{border:0;border-radius:999px;padding:9px 4px;background:transparent;color:var(--muted);font-weight:700;font-size:14px;cursor:pointer}
nav button[aria-selected=true]{background:var(--accent);color:#fff}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(23px,6.4vw,29px);line-height:1.45;margin:0;text-wrap:balance;text-align:center}
h2{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.45;margin:0}
h3{font-size:12.5px;letter-spacing:.12em;color:var(--muted);margin:4px 0 0;font-weight:700}
p{margin:0}
.lead{color:var(--muted);text-align:center}
.btn{font-weight:700;border-radius:999px;padding:13px 22px;cursor:pointer;border:1.5px solid var(--line);background:transparent;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-align:center;line-height:1.4;color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#fff}
.btn.block{width:100%}
.btn.sm{padding:8px 14px;font-size:13.5px}
.btn:disabled{opacity:.4;cursor:default}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{border:0;border-radius:10px;padding:9px 4px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer;font-size:14px}
.seg button[aria-checked=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.progress{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:1;height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold);transition:width .3s}
.q{font-family:var(--f-display);font-weight:600;font-size:20px;line-height:1.5;margin:0;text-wrap:balance}
.hint{margin:-8px 0 0;color:var(--muted);font-size:13px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:13px 16px;cursor:pointer;display:flex;gap:12px;align-items:center}
.opt:hover{border-color:var(--gold)}
.opt[aria-checked=true]{border-color:var(--accent);background:var(--soft)}
.opt .dot{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--muted)}
.opt[aria-checked=true] .dot{border:5px solid var(--accent)}
.opt.multi .dot{border-radius:6px}
.opt.multi[aria-checked=true] .dot{border:1.5px solid var(--accent);background:var(--accent)}
.opt small{display:block;color:var(--muted);font-size:12.5px;line-height:1.5}
.navrow{display:flex;justify-content:space-between;gap:10px}
.res{background:var(--accent);color:#F4EFE7;border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:12px}
.res .eyebrow{color:var(--pale)}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.res .rt{font-family:var(--f-display);font-weight:800;font-size:25px;line-height:1.4}
.res p,.res li{color:#E9E2D8;font-size:14px}
.res ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.swatches{display:flex;flex-wrap:wrap;gap:12px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:#E9E2D8;width:70px;text-align:center;line-height:1.35}
.sw i{width:46px;height:46px;border-radius:50%;border:2px solid rgba(255,255,255,.4)}
.plan{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:8px}
.plan.best{border-color:var(--gold)}
.plan .top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.badge{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink)}
.badge.g{background:var(--gold);color:#fff}
.badge.n{background:var(--accent);color:#fff}
.plan .nm{font-weight:700;font-size:15.5px;line-height:1.5}
.plan .ds{font-size:13px;color:var(--muted);line-height:1.6}
.plan .why{font-size:13px;line-height:1.6;background:var(--bg);border-radius:10px;padding:8px 12px}
.plan .pr{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.plan .pr b{font-size:21px}
.plan .pr s{color:var(--muted);font-size:13px}
.plan .pr small{color:var(--muted);font-size:12.5px}
.list{display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:13.5px}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.memo{background:var(--bg);border:1px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;white-space:pre-wrap;margin:0;font-family:var(--f-body)}
.note{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:14px;border:1.5px dashed var(--line);border-radius:14px;font-size:14px}
.home-btns{display:flex;flex-direction:column;gap:10px}
.home-btns .btn{justify-content:space-between;padding:16px 20px}
.home-btns .btn span small{display:block;font-weight:400;font-size:12.5px;opacity:.8}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
footer{text-align:center;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
footer a{color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

 });

 const tabs=[["diag","おすすめ診断"],["coupon","クーポン"],["menu","メニュー"]];
 $("#nav").innerHTML=tabs.map(([k,l])=>`<button role="tab" aria-selected="${view===k||(k==="diag"&&(view==="result"))}" data-v="${k}">${l}</button>`).join("");
 $("#nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{ if(b.dataset.v==="diag"&&view!=="diag"&&view!=="result"){step=0;} go(b.dataset.v==="diag"&&A.done?"result":b.dataset.v); });
}
function go(v){ view=v; render(); window.scrollTo({top:0}); }
$("#home").onclick=()=>go("home");
function render(){
 renderNav();
 ({home:renderHome,diag:renderQ,result:renderResult,coupon:renderCoupons,menu:renderMenu})[view]();
}
function visitSeg(){
 return `<div class="seg" role="radiogroup" aria-label="ご来店">${["新規","再来"].map(v=>`<button role="radio" aria-checked="${visit()===v}" data-visit="${v}">${v==="新規"?"はじめての方":"2回目以降の方"}</button>`).join("")}</div>`;
}
function bindVisit(){ document.querySelectorAll("[data-visit]").forEach(b=>b.onclick=()=>{A.visit=b.dataset.visit;render();}); }

function renderHome(){
 const n=CFG.coupons.filter(c=>c.kind==="fixed").length;
 $("#app").innerHTML=`<section class="card">
   <h1>あなたに合うメニューを見つけて<br>そのまま予約</h1>
   <p class="lead">かんたんな質問に答えるだけで、髪質と似合う髪色、おすすめのクーポンがわかります。空いている日時はホットペッパーの予約画面でそのまま選べます。</p>
   <div class="home-btns">
     <button class="btn primary" id="hStart"><span>1分でおすすめ診断<small>髪質・髪色・おすすめクーポン</small></span><span>→</span></button>
     <button class="btn" id="hCp"><span>クーポンから選ぶ<small>${n}件のクーポン</small></span><span>→</span></button>
     <button class="btn" id="hMenu"><span>メニューから選ぶ<small>通常メニュー・セットメニュー</small></span><span>→</span></button>
   </div></section>`;
 $("#hStart").onclick=()=>{A={visit:A.visit};step=0;go("diag");};
 $("#hCp").onclick=()=>go("coupon"); $("#hMenu").onclick=()=>go("menu");
}
function renderQ(){
 const qs=visibleQs(); if(step>=qs.length) step=qs.length-1;
 const q=qs[step], sel=A[q.k];
 const isSel=o=>q.multi?(sel||[]).includes(o[1]):sel===o[1];
 $("#app").innerHTML=`<section class="card">
   <div class="progress"><span>Q${step+1} / ${qs.length}</span><div class="bar"><i style="width:${step/qs.length*100}%"></i></div></div>
   <p class="q">${q.q}</p>${q.hint?`<p class="hint">${q.hint}</p>`:""}
   <div class="opts" role="${q.multi?"group":"radiogroup"}">${q.o.map((o,i)=>`<button class="opt${q.multi?" multi":""}" role="${q.multi?"checkbox":"radio"}" aria-checked="${isSel(o)}" data-i="${i}"><span class="dot"></span><span>${o[0]}${o[2]?`<small>${o[2]}</small>`:""}</span></button>`).join("")}</div>
   <div class="navrow"><button class="btn" id="prev">${step===0?"やめる":"戻る"}</button>
   ${q.multi||step===qs.length-1?`<button class="btn primary" id="next" ${(q.multi?!(sel&&sel.length):sel==null)?"disabled":""}>${step===qs.length-1?"結果を見る":"次へ"}</button>`:""}</div></section>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
   const o=q.o[+b.dataset.i];
   if(q.multi){ const a=A[q.k]||[]; const i=a.indexOf(o[1]); i<0?a.push(o[1]):a.splice(i,1); A[q.k]=a; renderQ(); }
   else { A[q.k]=o[1]; if(step<visibleQs().length-1){step++;} renderQ(); }
 });
 $("#prev").onclick=()=>{ if(step===0) go("home"); else {step--;renderQ();} };
 const nx=$("#next"); if(nx) nx.onclick=()=>{ if(step<visibleQs().length-1){step++;renderQ();} else {A.done=1;go("result");} };
}
function planCard(it,best){
 const isCp=!!it.cid;
 return `<div class="plan${best?" best":""}">
   <div class="top">${best?'<span class="badge g">いちばんのおすすめ</span>':""}<span class="badge${isCp?" n":""}">${isCp?(it.type==="全員"?"クーポン":it.type+"クーポン"):"メニュー"}</span>${(it.hit||[]).map(k=>`<span class="badge">${LABEL[k]||k}</span>`).join("")}</div>
   <span class="nm">${esc(it.n)}</span>
   ${it.d||it.cond?`<span class="ds">${esc([it.d,it.cond].filter(Boolean).join("／"))}</span>`:""}
   <div class="pr">${it.was?`<s>${yen(it.was)}</s>`:""}<b>${yen(it.p)}</b>${it.t?`<small>所要 ${mins(it.t)}目安</small>`:""}</div>
   <a class="btn ${best?"gold":"primary"} block" href="${it.url}" target="_blank" rel="noopener">空き日時を見て予約する</a>
 </div>`;
}
function memoText(){
 const h=hair(), c=color(), w=(A.wish||[]).map(x=>(WISH.find(y=>y[1]===x)||[x])[0]);
 return [`【おすすめ診断の結果】`,`ご希望：${w.join("・")}`,`髪質：${h.type.name}`,c?`似合う色：${c.P.n}`:null,A.skin&&A.skin!=="none"?`頭皮：${A.skin==="allergy"?"カラーでかぶれたことがある":"しみやすい"}`:null].filter(Boolean).join("\n");
}
function renderResult(){
 const h=hair(), c=color(), recs=recommend(), pct=pctFor(), lk=lumere();
 $("#app").innerHTML=`
  <section class="res">
   <div class="eyebrow">あなたの髪質</div><div class="rt">${h.type.name}</div><p>${h.type.desc}</p>
   <div class="eyebrow">おうちケアのポイント</div><ul>${h.type.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
  </section>
  ${c?`<section class="res">
   <div class="eyebrow">似合う髪色の傾向</div><div class="rt" style="font-size:21px">${c.P.n}</div><p>${c.P.d}</p>
   <div class="swatches">${c.P.c.map(([x,n])=>`<div class="sw"><i style="background:${x}"></i>${n}</div>`).join("")}</div>
   ${c.notes.length?`<ul>${c.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
  </section>`:""}
  <section class="card">
   <h2>あなたへのおすすめ</h2>
   <p class="note">${visit()==="新規"?"はじめての方":"2回目以降の方"}が使えるクーポン・メニューから選んでいます。</p>
   <div class="list">${recs.length?recs.map((r,i)=>planCard(r,i===0)).join(""):`<div class="empty">ぴったりのセットが見つかりませんでした。下の割引クーポンで通常メニューからお選びいただくか、クーポン一覧をご覧ください。</div>`}</div>
   ${pct.length?`<h3>通常メニューで予約するなら</h3>${pct.map(p=>`<div class="plan"><div class="top"><span class="badge n">${p.type}クーポン</span></div><span class="nm">${esc(p.n)}</span><span class="ds">${esc(p.d)}</span><a class="btn block" href="${p.url}" target="_blank" rel="noopener">このクーポンでメニューを選んで予約</a></div>`).join("")}`:""}
   ${(A.wish||[]).includes("kids")?(()=>{const k=CFG.coupons.find(x=>x.kind==="kids");return k?`<p class="note">お子様カット：${esc(k.n)}（${esc(k.d)}）。ご予約時のご要望欄に「キッズカット希望」とお書きください。</p>`:"";})():""}
  </section>
  <section class="card">
   <h3>ご予約のときに</h3>
   <p style="font-size:14px">予約画面の「ご要望・ご質問」欄に、診断の結果を貼り付けていただくと、当日のカウンセリングがスムーズです。</p>
   <pre class="memo" id="memo">${esc(memoText())}</pre>
   <button class="btn sm" id="copy">診断結果をコピー</button>
  </section>
  <section class="card">
   <div class="eyebrow">おうちでのケアに</div>
   <h2><span style="font-family:var(--f-latin);letter-spacing:.1em">LUMÉRE</span> ${lk==="vol"?"volume up shampoo":"CARE shampoo"} ＋ treatment</h2>
   <p style="font-size:14px">${lk==="vol"?"根元がつぶれやすい髪には、髪と頭皮をしっかり洗いフワッと仕上げる volume up shampoo。":h.key==="curl"?"くせ・うねりが気になる髪には、アミノ酸系洗浄成分でやさしく洗いツヤを与える CARE shampoo。":"カラーやダメージが気になる髪には、カシミヤケラチン・シルク配合の CARE shampoo。"}仕上げの treatment で、サロン帰りの手ざわりが長続きします。</p>
   <p style="font-size:14px">シャンプー＋トリートメント　はじめての方は <b>${yen(4400)}</b>（通常セット ${yen(6600)}）</p>
   ${CFG.lumShop?`<a class="btn block" href="${CFG.shop}/items/${lk==="vol"?"137692742":"137692640"}" target="_blank" rel="noopener">オンラインショップで見る</a><p class="note">ご来店時に店頭でもお求めいただけます。</p>`:`<p class="note">ご来店時に店頭でお求めいただけます。髪の状態に合わせて美容師がご案内します。</p>`}
  </section>
  <div class="navrow"><button class="btn" id="redo">もう一度診断する</button><button class="btn" id="toCp">クーポン一覧へ</button></div>`;
 $("#copy").onclick=async()=>{ try{await navigator.clipboard.writeText(memoText());toast("コピーしました");}catch(e){ const r=document.createRange(); r.selectNodeContents($("#memo")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("選択しました。コピーしてください"); } };
 $("#redo").onclick=()=>{A={visit:A.visit};step=0;go("diag");};
 $("#toCp").onclick=()=>go("coupon");
}
const CATS=[["all","すべて"],["cut","カット"],["color","カラー"],["tr","トリートメント"],["straight","縮毛矯正"],["perm","パーマ"],["spa","ヘッドスパ"]];
function catChips(){ return `<div class="chips">${CATS.filter(([k])=>k==="all"||CFG.coupons.concat(CFG.sets).some(c=>c.tags.includes(k))).map(([k,l])=>`<button class="chip" aria-pressed="${filt.cat===k}" data-cat="${k}">${l}</button>`).join("")}</div>`; }
function bindCats(){ document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{filt.cat=b.dataset.cat;render();}); }
function renderCoupons(){
 const ok=c=>c.type==="全員"||c.type===visit();
 const fixed=CFG.coupons.filter(c=>c.kind==="fixed"&&ok(c)&&(filt.cat==="all"||c.tags.includes(filt.cat)));
 const pct=CFG.coupons.filter(c=>c.kind!=="fixed"&&ok(c));
 $("#app").innerHTML=`<section class="card"><h2>クーポン</h2>${visitSeg()}${catChips()}</section>
  ${pct.length?`<section class="card"><h3>割引・特典クーポン</h3>${pct.map(p=>`<div class="plan"><div class="top"><span class="badge n">${p.type==="全員"?"クーポン":p.type+"クーポン"}</span></div><span class="nm">${esc(p.n)}</span><span class="ds">${esc([p.d,p.cond].filter(Boolean).join("／"))}</span>${p.kind==="pct"?`<a class="btn block" href="${p.url}" target="_blank" rel="noopener">このクーポンでメニューを選んで予約</a>`:""}</div>`).join("")}</section>`:""}
  <div class="list">${fixed.length?fixed.map(c=>planCard(c,false)).join(""):`<div class="empty">条件に合うクーポンがありません</div>`}</div>
  <p class="note">クーポンの内容・価格はホットペッパービューティーの掲載内容です。予約画面で最新の内容をご確認ください。</p>`;
 bindVisit(); bindCats();
}
function renderMenu(){
 const list=CFG.sets.filter(m=>filt.cat==="all"||m.tags.includes(filt.cat));
 $("#app").innerHTML=`<section class="card"><h2>メニュー</h2><p class="note">通常料金のメニューです。割引クーポンは「クーポン」タブからご利用ください。</p>${catChips()}</section>
  <div class="list">${list.length?list.map(m=>planCard(m,false)).join(""):`<div class="empty">該当するメニューがありません</div>`}</div>
  <a class="btn block" href="${CFG.reserveUrl}" target="_blank" rel="noopener">そのほかのメニューで予約する</a>`;
 bindCats();
}
render();
</script>

<style>
.install{background:var(--surface);border:1.5px solid var(--gold);border-radius:18px;padding:16px 18px;display:flex;gap:14px;align-items:flex-start}
.install img{width:52px;height:52px;border-radius:12px;flex:none}
.install b{display:block;font-size:15px}
.install p{font-size:13px;color:var(--muted);line-height:1.6;margin:2px 0 8px}
.install .row{display:flex;gap:8px;flex-wrap:wrap}
.ios-share{display:inline-block;width:14px;height:16px;vertical-align:-2px;border:1.5px solid currentColor;border-top:0;border-radius:2px;position:relative;margin:0 2px}
.ios-share::before{content:"";position:absolute;left:50%;top:-6px;width:1.5px;height:11px;background:currentColor;transform:translateX(-50%)}
</style>
<script>
(function(){
  const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  let deferred=null;
  const get=k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
  window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferred=e;show();});
  const ios=/iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
  function show(){
    if(standalone || get("installHidden")) return;
    const main=document.getElementById("app"); if(!main || document.getElementById("installBox")) return;
    if(!ios && !deferred) return;
    const box=document.createElement("section"); box.className="install"; box.id="installBox";
    box.innerHTML=`<img src="apple-touch-icon.png" alt=""><div><b>ホーム画面に追加すると、アプリのように使えます</b>
      <p>${ios?'Safariの下にある共有ボタン <span class="ios-share"></span> をタップし、「ホーム画面に追加」を選んでください。':'ボタンを押すとホーム画面にアイコンが追加されます。'}</p>
      <div class="row">${ios?"":'<button class="btn primary sm" id="doInstall">ホーム画面に追加</button>'}<button class="btn sm" id="hideInstall">閉じる</button></div></div>`;
    main.parentNode.insertBefore(box, main);
    const di=document.getElementById("doInstall"); if(di) di.onclick=async()=>{ deferred.prompt(); await deferred.userChoice; deferred=null; box.remove(); };
    document.getElementById("hideInstall").onclick=()=>{ set("installHidden","1"); box.remove(); };
  }
  window.addEventListener("load",()=>{ show(); if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{}); });
})();
</script>
</body>
</html>
